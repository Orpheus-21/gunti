name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# the version gunti is developed and tested against. bump deliberately, not
# automatically: a newer Odin can change core, and the tests are the only thing
# that would notice.
env:
  ODIN_VERSION: dev-2026-08

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang
          curl -fsSL -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz"
          mkdir -p "$HOME/odin"
          tar -xzf odin.tar.gz -C "$HOME/odin"
          # the tarball's layout is not contractual, so locate the binary rather
          # than assume a path. odin finds core/ relative to itself.
          dirname "$(find "$HOME/odin" -type f -executable -name odin | head -1)" >> "$GITHUB_PATH"

      - run: odin version
      - run: make
      - run: make test

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang
          curl -fsSL -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz"
          mkdir -p "$HOME/odin"
          tar -xzf odin.tar.gz -C "$HOME/odin"
          dirname "$(find "$HOME/odin" -type f -executable -name odin | head -1)" >> "$GITHUB_PATH"

      # static, so the published binary runs on any linux whatever its libc
      - run: make release

      - name: Refuse to publish a binary that is not static
        run: |
          file gunti | grep -q "statically linked"
          ldd gunti 2>&1 | grep -q "not a dynamic executable"

      - name: Attach binary and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # upload fails outright if no release exists for the tag, so a bare
        # "git push --tags" would build the binary and then drop it. create the
        # release first if it is missing, and a tag alone is enough to publish.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" gunti gunti.sha256 --clobber
